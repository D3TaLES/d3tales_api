[pytest]
minversion = 7.0
addopts =
    -ra
    --strict-config
    --strict-markers
    --showlocals
    --ignore=tests/integration/processors/test_nlp_processing.py
testpaths = tests
python_files = test_*.py
norecursedirs =
    tests/legacy

markers =
    unit: isolated tests with no filesystem, network, or database dependency
    integration: tests crossing module boundaries
    slow: comparatively expensive tests
    database: requires a MongoDB-compatible database
    network: requires an external service
    gaussian: requires Gaussian-derived fixture data
    electrochemistry: electrochemistry parser/calculator tests
    optional: requires an optional dependency
filterwarnings =
    error
    ignore::DeprecationWarning:pymatgen.*
    ignore::DeprecationWarning:monty.*
